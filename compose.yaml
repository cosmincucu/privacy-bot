services:
  privacy-bot:
    image: privacy-bot:${APP_REVISION:?set exact source revision}
    build: .
    container_name: privacy-bot
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PRIVACY_BOT_DATA: /data
      ROOT_PATH: ${ROOT_PATH:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8791/}
      APP_REVISION: ${APP_REVISION}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8791:8791"
    volumes:
      - ${DATA_PATH:-./data}:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 512mb
    mem_limit: 2g
    pids_limit: 300
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp-browser.json
    healthcheck:
      test: [CMD, python, -X, utf8, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
networks:
  default:
    name: ${PROXY_NETWORK:-privacy-bot_default}
    external: ${PROXY_NETWORK_EXTERNAL:-false}
