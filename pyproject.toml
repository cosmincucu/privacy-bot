[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-bot"
version = "0.1.0"
description = "Locally hosted personal exposure, removal and credit monitoring"
requires-python = ">=3.12"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "httpx==0.28.1", "beautifulsoup4==4.13.4", "playwright==1.63.0", "cryptography==46.0.5", "python-multipart==0.0.22", "pypdf==6.8.0"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.setuptools.packages.find]
include = ["privacy_bot*"]

[tool.setuptools.package-data]
privacy_bot = ["static/*", "catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
